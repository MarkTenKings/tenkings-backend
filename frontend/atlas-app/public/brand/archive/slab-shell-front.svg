<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 802.64 1353.82" role="img" data-slab-model="atlas-illustrative-slab-v2" data-slab-studio="atlas-neutral-studio-v2">
  <title>Illustrative ATLAS holder, front view</title>
  <desc>Shared studio presentation using the owner-supplied 80.264 by 135.382 millimeter exterior. Neutral clear shell, bevels, two-piece seal and single lower support are illustrative rather than measured manufacturing CAD. Approved photographs and saved label artwork are separate unfiltered layers; the inspection padding is outside the displayed card viewport.</desc>
  <defs>
    <linearGradient id="outer-wall" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#959595"/><stop offset=".008" stop-color="#e8e8e8"/><stop offset=".022" stop-color="#fff"/><stop offset=".038" stop-color="#c9c9c9"/>
      <stop offset=".073" stop-color="#f2f2f2"/><stop offset=".45" stop-color="#fafafa"/><stop offset=".89" stop-color="#f5f5f5"/>
      <stop offset=".952" stop-color="#d8d8d8"/><stop offset=".974" stop-color="#fff"/><stop offset=".99" stop-color="#b8b8b8"/><stop offset="1" stop-color="#f3f3f3"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2=".76" y2="1">
      <stop stop-color="#fff" stop-opacity=".88"/><stop offset=".27" stop-color="#efefef" stop-opacity=".35"/>
      <stop offset=".65" stop-color="#fff" stop-opacity=".68"/><stop offset="1" stop-color="#e3e3e3" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2=".2" y2="1">
      <stop stop-color="#fff"/><stop offset=".022" stop-color="#d9d9d9"/><stop offset=".065" stop-color="#f7f7f7"/>
      <stop offset=".91" stop-color="#f5f5f5"/><stop offset=".97" stop-color="#bababa"/><stop offset=".99" stop-color="#fff"/><stop offset="1" stop-color="#adadad"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="1" y2=".16">
      <stop stop-color="#b2b2b2"/><stop offset=".014" stop-color="#fff"/><stop offset=".038" stop-color="#dbdbdb"/>
      <stop offset=".075" stop-color="#f6f6f6"/><stop offset=".92" stop-color="#f8f8f8"/><stop offset=".974" stop-color="#dbdbdb"/>
      <stop offset=".99" stop-color="#fff"/><stop offset="1" stop-color="#a8a8a8"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bbbbbb"/><stop offset=".3" stop-color="#fff"/><stop offset=".55" stop-color="#efefef"/><stop offset="1" stop-color="#bfbfbf"/>
    </linearGradient>
  </defs>
  <!-- Outer rolled bevel and visible two-piece joining wall. All dimensions
       match the reusable 3D holder; window placement remains unchanged. -->
  <rect x="1.4" y="1.4" width="799.84" height="1351.02" rx="27" fill="url(#outer-wall)" stroke="#b1b1b1" stroke-width="1.6"/>
  <rect x="5.8" y="5.8" width="791.04" height="1342.22" rx="23.5" fill="url(#bevel)" stroke="#fff" stroke-width="2.6"/>
  <rect x="11" y="11" width="780.64" height="1331.82" rx="20" fill="none" stroke="#bdbdbd" stroke-opacity=".6" stroke-width="1.1"/>
  <rect x="18" y="18" width="766.64" height="1317.82" rx="18.5" fill="url(#face)" stroke="#fff" stroke-width="2"/>
  <rect x="24.52" y="24.52" width="753.6" height="1304.78" rx="19.5" fill="none" stroke="#bfbfbf" stroke-opacity=".62" stroke-width="2.3"/>
  <rect x="29" y="29" width="744.64" height="1295.82" rx="18" fill="none" stroke="#fff" stroke-width="3.3"/>
  <!-- Recessed label bay and a plain card window, behind exact media. -->
  <rect x="49" y="54" width="704.64" height="225" rx="11" fill="url(#pocket)" stroke="#bbbbbb" stroke-width="1.3"/>
  <rect x="54.5" y="59.5" width="693.64" height="214" rx="7.4" fill="#f3f3f3" stroke="#fff" stroke-width="2.6"/>
  <rect x="57.5" y="62.5" width="687.64" height="208" rx="5.5" fill="none" stroke="#cdcdcd" stroke-width="1.1"/>
  <rect x="43.82" y="293.75" width="715" height="8.5" rx="4.25" fill="url(#rib)"/>
  <path d="M48 295.1H754" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
  <rect x="81.32" y="330" width="640" height="900" rx="5" fill="#fff"/>
  <rect x="50" y="1243.35" width="702.64" height="8.5" rx="4.25" fill="url(#rib)"/>
  <!-- Controlled studio strips remain on the clear frame, never on card art. -->
  <path d="M9.5 45V1263" stroke="#fff" stroke-width="3.6" stroke-linecap="round" opacity=".97"/>
  <path d="M15.5 74V1241" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".72"/>
  <path d="M790 87V1267" stroke="#fff" stroke-width="2.8" stroke-linecap="round" opacity=".94"/>
  <path d="M41 7.5H700" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M86 1345H744" stroke="#fff" stroke-width="3.4" stroke-linecap="round" opacity=".95"/>
</svg>
