name: Vault unsigned Linux appliance build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vault-linux-release-build.yml'
      - 'deploy/vault-linux/**'
      - 'packages/vault-machine/**'
      - 'packages/vault-contracts/**'
      - 'frontend/vault-kiosk/**'
      - 'scripts/test-vault-node.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-linux-release-build-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  unsigned-linux:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'codex/vault-spark-release-20261007') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/codex/vault-spark-release-20261007')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SOURCE }}
          persist-credentials: false
      - name: Install native build prerequisites on this ephemeral runner
        run: |
          test "$(uname -m)" = x86_64
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential python3 ca-certificates xz-utils
      - name: Download and verify the exact official Node archive
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          pin = json.loads(Path('deploy/vault-linux/runtime.json').read_text())
          assert pin['nodeVersion'] == '22.23.2' and pin['pnpmVersion'] == '9.12.0'
          assert pin['nodeArchive'] == 'node-v22.23.2-linux-x64.tar.xz'
          assert pin['nodeArchiveSha256'] == 'd60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['EXPECTED_SOURCE']
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
          temp = Path(os.environ['RUNNER_TEMP'])
          archive = temp / pin['nodeArchive']
          url = 'https://nodejs.org/download/release/v' + pin['nodeVersion'] + '/' + pin['nodeArchive']
          digest = hashlib.sha256()
          with urllib.request.urlopen(url, timeout=60) as response, archive.open('xb') as output:
              while chunk := response.read(1024 * 1024):
                  digest.update(chunk); output.write(chunk)
          assert digest.hexdigest() == pin['nodeArchiveSha256'], 'Official Node archive hash mismatch'
          # Extraction is permitted only after verifying the pinned complete archive.
          subprocess.run(['tar', '-xJf', str(archive), '-C', str(temp)], check=True)
          node_bin = temp / ('node-v' + pin['nodeVersion'] + '-linux-x64') / 'bin'
          assert subprocess.check_output([str(node_bin / 'node'), '--version'], text=True).strip() == 'v' + pin['nodeVersion']
          with open(os.environ['GITHUB_PATH'], 'a') as output: output.write(str(node_bin) + '\n')
          PY
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
          run_install: false
      - name: Build committed Linux source and run all existing appliance checks
        run: |
          test "$(node --version)" = v22.23.2
          test "$(pnpm --version)" = 9.12.0
          export npm_config_nodedir="$RUNNER_TEMP/node-v22.23.2-linux-x64"
          python3 -B deploy/vault-linux/build-release.py \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/vault-linux-unsigned" \
            --node-archive "$RUNNER_TEMP/node-v22.23.2-linux-x64.tar.xz" \
            2>&1 | tee "$RUNNER_TEMP/vault-linux-build.log"
      - name: Verify unsigned archive membership and write source/hash receipt
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, stat, subprocess, tarfile
          from pathlib import Path
          def sha(file):
              digest = hashlib.sha256()
              with Path(file).open('rb') as stream:
                  while chunk := stream.read(1024 * 1024): digest.update(chunk)
              return digest.hexdigest()
          temp = Path(os.environ['RUNNER_TEMP'])
          release = temp / 'vault-linux-unsigned'
          source = os.environ['EXPECTED_SOURCE']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
          build = json.loads((release / 'source-build.json').read_text())
          probe = json.loads((release / 'native-runtime-evidence.json').read_text())
          pin = json.loads(Path('deploy/vault-linux/runtime.json').read_text())
          assert build['sourceCommit'] == source and build['sourceState'] == 'CLEAN_COMMITTED'
          assert build['buildCompleted'] is True and build['releaseAuthorized'] is True
          assert build['nativeBuild'] == 'linux-x64' and build['nativeProbe'] == probe
          assert build['nodeArchiveSha256'] == pin['nodeArchiveSha256'] and build['pnpmVersion'] == pin['pnpmVersion']
          assert build['lockfileSha256'] == sha('pnpm-lock.yaml')
          assert probe['nodeVersion'] == pin['nodeVersion'] and probe['platform'] == 'linux' and probe['architecture'] == 'x64'
          assert probe['betterSqlite3Version'] == pin['betterSqlite3Version']
          assert all(probe[key] is True for key in ('wal', 'transactionRollback', 'integrity'))
          assert not (release / 'release.json').exists() and not (release / 'release.sig').exists(), 'Unsigned output required'
          inventory = []
          for file in [release, *sorted(release.rglob('*'))]:
              info = file.lstat()
              assert stat.S_ISDIR(info.st_mode) or stat.S_ISREG(info.st_mode), 'No links or special members'
              mode = stat.S_IMODE(info.st_mode)
              assert mode & 0o7022 == 0, 'No privileged or group/world writable members'
              name = 'release' + ('/' + file.relative_to(release).as_posix() if file != release else '')
              inventory.append({'name': name, 'mode': mode, 'kind': 'directory' if file.is_dir() else 'file',
                                **({'size': info.st_size, 'sha256': sha(file)} if file.is_file() else {})})
          artifacts = temp / 'vault-linux-artifacts'; artifacts.mkdir(mode=0o700)
          archive = artifacts / ('vault-linux-unsigned-' + source + '.tar.gz')
          def owner(info):
              info.uid = info.gid = 0; info.uname = info.gname = 'root'
              return info
          with tarfile.open(archive, 'x:gz', dereference=True) as output:
              for entry in inventory:
                  relative = entry['name'].removeprefix('release').lstrip('/')
                  output.add(release / relative, arcname=entry['name'], recursive=False, filter=owner)
          with tarfile.open(archive, 'r:gz') as check:
              members = check.getmembers()
              assert [m.name for m in members] == [e['name'] for e in inventory]
              for member, entry in zip(members, inventory):
                  assert member.mode == entry['mode'] and (member.isdir() if entry['kind'] == 'directory' else member.isfile())
                  if member.isfile():
                      assert member.size == entry['size']
                      assert hashlib.sha256(check.extractfile(member).read()).hexdigest() == entry['sha256']
          receipt = {'schemaVersion': 1, 'classification': 'UNSIGNED_BUILD_ONLY', 'sourceCommit': source,
                     'workflowRunId': os.environ['GITHUB_RUN_ID'], 'workflowRunAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'archiveName': archive.name, 'archiveSha256': sha(archive), 'archiveBytes': archive.stat().st_size,
                     'archiveRoot': 'release', 'memberCount': len(inventory), 'membersVerified': True,
                     'inventorySha256': hashlib.sha256(json.dumps(inventory, sort_keys=True, separators=(',', ':')).encode()).hexdigest(),
                     'sourceBuildSha256': sha(release / 'source-build.json'), 'nativeProbe': probe,
                     'nodeArchiveSha256': pin['nodeArchiveSha256'], 'lockfileSha256': build['lockfileSha256'],
                     'signed': False, 'deploymentAuthorized': False}
          with (artifacts / 'unsigned-build-receipt.json').open('x') as output: json.dump(receipt, output, indent=2); output.write('\n')
          print(json.dumps(receipt))
          PY
      - name: Upload unsigned build and public source/hash receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vault-linux-unsigned-${{ env.EXPECTED_SOURCE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vault-linux-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain the secret-free build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vault-linux-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vault-linux-build.log
          if-no-files-found: ignore
          retention-days: 14
